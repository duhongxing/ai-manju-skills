name: Continuity v2 checks
on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'skills/**'
      - '.github/workflows/continuity-v2.yml'
  push:
    branches:
      - 'feature/continuity-v2'
jobs:
  metadata-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample continuity validation
        run: python scripts/validate_continuity.py examples/mie-men-zhi-ye/shots.json
      - name: Ensure all 21 skills use independent views
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path('skills').glob('*/SKILL.md'))
          assert len(files)==21, f'Expected 21 skills, found {len(files)}'
          for f in files:
              s=f.read_text(encoding='utf-8')
              assert '三视图（正面、侧面、背面同排等距排列）' not in s, str(f)
              assert '独立' in s and ('不得拼图' in s or '禁止三视图拼图' in s), str(f)
          print('PASS: 21 genre templates')
          PY
